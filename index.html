<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Jump - Game Interaktif</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; background-color: #1a252f; color: white; margin: 0; padding: 0; overflow: hidden; }
        
        #lobby-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2c3e50; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 10; }
        #qrcode { margin: 20px auto; background: white; padding: 15px; border-radius: 8px; display: inline-block; }
        #status-teks { font-size: 1.2rem; color: #f1c40f; font-weight: bold; }
        
        #game-area { display: none; width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #pesan-game { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 8px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="lobby-area">
        <h1 style="margin-top:0;">Scan untuk Bermain!</h1>
        <div id="qrcode"></div>
        <p id="status-teks">Menunggu pemain terhubung...</p>
        <p style="font-size: 0.9rem; color: #bdc3c7;">Room ID: <span id="room-id-display"></span></p>
    </div>

    <div id="game-area">
        <div id="pesan-game">Menunggu Tembakan Pertama...</div>
        <canvas id="gameCanvas"></canvas>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB00E-07MNJoN0IfNOsCm9KcH-y7TTwvYQ",
        authDomain: "belajar-github-firestore.firebaseapp.com",
        projectId: "belajar-github-firestore",
        storageBucket: "belajar-github-firestore.firebasestorage.app",
        messagingSenderId: "246762592469",
        appId: "1:246762592469:web:595d8f2a8a78909771aa5c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const roomId = "Room-" + Math.random().toString(36).substring(2, 6).toUpperCase();
    document.getElementById("room-id-display").innerText = roomId;

    const currentUrl = window.location.href.split('/').slice(0, -1).join('/'); 
    const controllerUrl = `${currentUrl}/controller.html?room=${roomId}`;

    new QRCode(document.getElementById("qrcode"), { text: controllerUrl, width: 200, height: 200 });

    let triggerTerakhir = 0; 

    async function inisialisasiRoom() {
        const docRef = doc(db, "sesi_game", roomId);
        await setDoc(docRef, { status: "menunggu", triggerTime: 0 });

        onSnapshot(docRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();

                if (data.status === "terhubung" && document.getElementById("lobby-area").style.display !== "none") {
                    document.getElementById("lobby-area").style.display = "none";
                    document.getElementById("game-area").style.display = "block";
                    resizeCanvas(); 
                }

                if (data.triggerTime > 0 && data.triggerTime !== triggerTerakhir) {
                    triggerTerakhir = data.triggerTime;
                    lepaskanBolaKecil();
                }
            }
        });
    }
    inisialisasiRoom();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let nodesArray = [];
    let currentNodeIndex = 0;
    let kameraY = 0; 
    let targetKameraY = 0;

    const bolaKecil = {
        radius: 12,
        warna: '#e74c3c',
        sudut: 0,
        kecepatanRotasi: 0.04, 
        kecepatanTerbang: 16,
        status: 'mengorbit', 
        x: 0, 
        y: 0,
        vx: 0, 
        vy: 0  
    };

    // FUNGSI MEMBUAT BANYAK BOLA BESAR
    function susunLevel() {
        let tengahX = window.innerWidth / 2;
        nodesArray = [
            { x: tengahX, y: 0, radius: 50, warna: '#3498db' },
            { x: tengahX - 150, y: -250, radius: 40, warna: '#9b59b6' },
            { x: tengahX + 150, y: -500, radius: 45, warna: '#2ecc71' },
            { x: tengahX - 120, y: -750, radius: 35, warna: '#e67e22' },
            { x: tengahX + 100, y: -1000, radius: 50, warna: '#1abc9c' },
            { x: tengahX, y: -1300, radius: 70, warna: '#f1c40f', finish: true }
        ];
        currentNodeIndex = 0;
        bolaKecil.status = 'mengorbit';
        bolaKecil.sudut = 0;
        if(nodesArray.length > 0) kameraY = nodesArray[0].y;
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        susunLevel();
    }
    window.addEventListener('resize', resizeCanvas);

    // SOLUSI BUG: Panggil ini di awal agar array bola terisi sebelum animasi berjalan!
    resizeCanvas();

    function jalankanGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Jika data belum siap, cegah error
        if (nodesArray.length === 0) {
            requestAnimationFrame(jalankanGame);
            return;
        }

        // Kamera mengikuti posisi bola saat ini
        targetKameraY = nodesArray[currentNodeIndex].y;
        kameraY += (targetKameraY - kameraY) * 0.1; 

        // Gambar Garis Penghubung antar Bola
        ctx.beginPath();
        ctx.moveTo(nodesArray[0].x, nodesArray[0].y - kameraY + canvas.height/2);
        for(let i = 1; i < nodesArray.length; i++) {
            ctx.lineTo(nodesArray[i].x, nodesArray[i].y - kameraY + canvas.height/2);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 15;
        ctx.stroke();

        // Menggambar Semua Bola Besar
        for(let i = 0; i < nodesArray.length; i++) {
            let node = nodesArray[i];
            let drawY = node.y - kameraY + canvas.height / 2;

            ctx.beginPath();
            ctx.arc(node.x, drawY, node.radius, 0, Math.PI * 2);
            ctx.fillStyle = node.warna;
            if(i === currentNodeIndex) {
                ctx.shadowBlur = 30; // Bola yang sedang dipijak bersinar lebih terang
                ctx.shadowColor = node.warna;
            } else {
                ctx.shadowBlur = 0;
            }
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;

            if (node.finish) {
                ctx.fillStyle = "black";
                ctx.font = "bold 20px Arial";
                ctx.textAlign = "center";
                ctx.fillText("FINISH", node.x, drawY + 7);
            }
        }

        let nodeAktif = nodesArray[currentNodeIndex];
        let jarakOrbitIdeal = nodeAktif.radius + 30;

        // Logika Bola Kecil Berputar
        if (bolaKecil.status === 'mengorbit') {
            bolaKecil.sudut += bolaKecil.kecepatanRotasi;
            bolaKecil.x = nodeAktif.x + jarakOrbitIdeal * Math.cos(bolaKecil.sudut);
            bolaKecil.y = nodeAktif.y + jarakOrbitIdeal * Math.sin(bolaKecil.sudut);

        // Logika Bola Kecil Meluncur Tembak
        } else if (bolaKecil.status === 'lepas') {
            bolaKecil.x += bolaKecil.vx;
            bolaKecil.y += bolaKecil.vy;

            // Cek Tabrakan dengan orbit bola lain
            for (let i = 0; i < nodesArray.length; i++) {
                if (i === currentNodeIndex) continue;

                let targetNode = nodesArray[i];
                let jarakTargetOrbit = targetNode.radius + 30;
                
                let dx = bolaKecil.x - targetNode.x;
                let dy = bolaKecil.y - targetNode.y;
                let distance = Math.sqrt(dx*dx + dy*dy);

                if (distance <= jarakTargetOrbit + 15) { 
                    currentNodeIndex = i; // Pindah kepemilikan bola
                    bolaKecil.status = 'mengorbit';
                    bolaKecil.sudut = Math.atan2(dy, dx); // Memuluskan rotasi saat mendarat
                    
                    if (targetNode.finish) {
                         document.getElementById("pesan-game").innerText = "🏆 MENANG! Puncak Tercapai!";
                         document.getElementById("pesan-game").style.color = "#f1c40f";
                    } else {
                         document.getElementById("pesan-game").innerText = "Bagus! Lompat lagi ke atas!";
                         document.getElementById("pesan-game").style.color = "#2ecc71";
                    }
                    break;
                }
            }

            // Aturan Jatuh: Jika bola terlalu jauh meleset
            let batasBawah = kameraY + (canvas.height / 2); 
            if (bolaKecil.y > batasBawah + 100 || bolaKecil.x < -100 || bolaKecil.x > canvas.width + 100) {
                document.getElementById("pesan-game").innerText = "❌ Meleset! Jatuh dan mulai dari awal...";
                document.getElementById("pesan-game").style.color = "#e74c3c";
                susunLevel(); 
            }
        }

        // Menggambar Bola Kecil
        let drawBolaKecilY = bolaKecil.y - kameraY + canvas.height / 2;
        ctx.beginPath();
        ctx.arc(bolaKecil.x, drawBolaKecilY, bolaKecil.radius, 0, Math.PI * 2);
        ctx.fillStyle = bolaKecil.warna;
        ctx.shadowBlur = 10;
        ctx.shadowColor = bolaKecil.warna;
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;

        requestAnimationFrame(jalankanGame);
    }

    // Fungsi Trigger yang mendengarkan HP
    function lepaskanBolaKecil() {
        if (bolaKecil.status === 'mengorbit' && !nodesArray[currentNodeIndex].finish) {
            bolaKecil.status = 'lepas';
            bolaKecil.vx = bolaKecil.kecepatanTerbang * Math.cos(bolaKecil.sudut + Math.PI / 2);
            bolaKecil.vy = bolaKecil.kecepatanTerbang * Math.sin(bolaKecil.sudut + Math.PI / 2);

            document.getElementById("pesan-game").innerText = "Meluncur...";
            document.getElementById("pesan-game").style.color = "white";
        }
    }

    jalankanGame();

</script>
</body>
</html>
