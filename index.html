<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Soal Manual ke Firestore</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; }
        .form-card { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="file"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .pilihan-container input { margin-bottom: 8px; }
        button { width: 100%; background-color: #1a73e8; color: white; border: none; padding: 12px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #1557b0; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Tambah Soal Kuis Baru</h2>
    <p>Isi formulir di bawah ini untuk memasukkan soal ke Firestore secara otomatis.</p>
    <hr style="border:0; border-top: 1px solid #eee; margin-bottom: 20px;">

    <div class="form-group">
        <label for="pertanyaan">Teks Pertanyaan / Soal:</label>
        <input type="text" id="pertanyaan" placeholder="Contoh: Hewan apa yang memiliki belalai?" required>
    </div>

    <div class="form-group">
        <label for="gambar-file">Upload Gambar Soal (Opsional):</label>
        <input type="file" id="gambar-file" accept="image/*">
    </div>

    <div class="form-group pilihan-container">
        <label>Pilihan Jawaban:</label>
        <input type="text" id="p1" placeholder="Pilihan A" required>
        <input type="text" id="p2" placeholder="Pilihan B" required>
        <input type="text" id="p3" placeholder="Pilihan C" required>
        <input type="text" id="p4" placeholder="Pilihan D" required>
    </div>

    <div class="form-group">
        <label for="jawaban-benar">Jawaban yang Benar:</label>
        <select id="jawaban-benar">
            <option value="0">Pilihan A</option>
            <option value="1">Pilihan B</option>
            <option value="2">Pilihan C</option>
            <option value="3">Pilihan D</option>
        </select>
    </div>

    <button id="btn-simpan">Simpan Soal ke Firestore</button>
    <div id="status"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi Firebase Anda
    const firebaseConfig = {
        apiKey: "AIzaSyB00E-07MNJoN0IfNOsCm9KcH-y7TTwvYQ",
        authDomain: "belajar-github-firestore.firebaseapp.com",
        projectId: "belajar-github-firestore",
        storageBucket: "belajar-github-firestore.firebasestorage.app",
        messagingSenderId: "246762592469",
        appId: "1:246762592469:web:595d8f2a8a78909771aa5c",
        measurementId: "G-5NRM7J8KVH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Kunci API ImgBB (GANTI DENGAN API KEY MILIK ANDA)
    const IMGBB_API_KEY = c3468386be06bce08bbaaf46baf4cab3;

    const btnSimpan = document.getElementById("btn-simpan");
    const statusDiv = document.getElementById("status");

    btnSimpan.addEventListener("click", async () => {
        // Ambil nilai dari form
        const pertanyaan = document.getElementById("pertanyaan").value;
        const fileGambar = document.getElementById("gambar-file").files[0];
        const pilihan = [
            document.getElementById("p1").value,
            document.getElementById("p2").value,
            document.getElementById("p3").value,
            document.getElementById("p4").value
        ];
        const jawabanBenar = parseInt(document.getElementById("jawaban-benar").value);

        // Validasi dasar
        if (!pertanyaan || !pilihan[0] || !pilihan[1] || !pilihan[2] || !pilihan[3]) {
            statusDiv.innerText = "⚠️ Harap isi semua teks soal dan pilihan jawaban!";
            statusDiv.style.color = "#ea4335";
            return;
        }

        // Kunci tombol saat proses berjalan
        btnSimpan.disabled = true;
        statusDiv.innerText = "⏳ Sedang memproses soal...";
        statusDiv.style.color = "#333";

        let finalGambarUrl = "";

        try {
            // 1. Jika user memilih file gambar, upload dulu ke ImgBB secara otomatis
            if (fileGambar) {
                statusDiv.innerText = "⏳ Sedang mengupload gambar ke ImgBB...";
                
                const formData = new FormData();
                formData.append("image", fileGambar);

                const response = new FormData();
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                
                const dataHasilJson = await res.json();
                
                if (dataHasilJson.success) {
                    finalGambarUrl = dataHasilJson.data.url; // Ini link direct URL .jpg-nya
                } else {
                    throw new Error("Gagal mengupload gambar ke ImgBB.");
                }
            }

            // 2. Simpan semua data ke Cloud Firestore
            statusDiv.innerText = "⏳ Menyimpan data soal ke Firestore...";
            
            await addDoc(collection(db, "kuis_soal"), {
                pertanyaan: pertanyaan,
                gambar_url: finalGambarUrl, // Berisi link ImgBB atau kosong jika tidak upload gambar
                pilihan: pilihan,
                jawaban_benar: jawabanBenar,
                waktu_dibuat: new Date() // Opsional, agar tahu kapan soal dibuat
            });

            // 3. Sukses
            statusDiv.innerText = "🎉 Soal berhasil disimpan manual ke Firestore!";
            statusDiv.style.color = "#34a853";
            
            // Reset form setelah sukses
            document.getElementById("pertanyaan").value = "";
            document.getElementById("gambar-file").value = "";
            document.getElementById("p1").value = "";
            document.getElementById("p2").value = "";
            document.getElementById("p3").value = "";
            document.getElementById("p4").value = "";

        } catch (error) {
            console.error("Terjadi kesalahan:", error);
            statusDiv.innerText = "❌ Gagal menyimpan soal. Periksa konsol / API Key Anda.";
            statusDiv.style.color = "#ea4335";
        } finally {
            btnSimpan.disabled = false;
        }
    });
</script>
</body>
</html>
