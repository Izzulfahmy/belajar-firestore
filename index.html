<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Jump - Perfect Spacing</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; background-color: #0b0f19; color: white; margin: 0; padding: 0; overflow: hidden; }
        
        #lobby-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111827; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); border: 1px solid #1f2937; z-index: 10; }
        #qrcode { margin: 20px auto; background: white; padding: 15px; border-radius: 8px; display: inline-block; }
        #status-teks { font-size: 1.2rem; color: #f1c40f; font-weight: bold; }
        
        #game-area { display: none; width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #btn-reset { position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; backdrop-filter: blur(5px); transition: 0.2s; z-index: 20; }
        #btn-reset:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

    <div id="lobby-area">
        <h1 style="margin-top:0; color: #e2e8f0;">Galaxy Orbit Jump</h1>
        <div id="qrcode"></div>
        <p id="status-teks">Menunggu koneksi controller...</p>
        <p style="font-size: 0.9rem; color: #6b7280;">Room ID: <span id="room-id-display" style="color: #38bdf8;"></span></p>
    </div>

    <div id="game-area">
        <button id="btn-reset">Acak Ulang Level</button>
        <canvas id="gameCanvas"></canvas>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB00E-07MNJoN0IfNOsCm9KcH-y7TTwvYQ",
        authDomain: "belajar-github-firestore.firebaseapp.com",
        projectId: "belajar-github-firestore",
        storageBucket: "belajar-github-firestore.firebasestorage.app",
        messagingSenderId: "246762592469",
        appId: "1:246762592469:web:595d8f2a8a78909771aa5c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const roomId = "Room-" + Math.random().toString(36).substring(2, 6).toUpperCase();
    document.getElementById("room-id-display").innerText = roomId;

    const currentUrl = window.location.href.split('/').slice(0, -1).join('/'); 
    const controllerUrl = `${currentUrl}/controller.html?room=${roomId}`;

    new QRCode(document.getElementById("qrcode"), { text: controllerUrl, width: 200, height: 200 });

    let triggerTerakhir = 0; 

    async function inisialisasiRoom() {
        const docRef = doc(db, "sesi_game", roomId);
        await setDoc(docRef, { status: "menunggu", triggerTime: 0 });

        onSnapshot(docRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();

                if (data.status === "terhubung" && document.getElementById("lobby-area").style.display !== "none") {
                    document.getElementById("lobby-area").style.display = "none";
                    document.getElementById("game-area").style.display = "block";
                    resizeCanvas(); 
                }

                if (data.triggerTime > 0 && data.triggerTime !== triggerTerakhir) {
                    triggerTerakhir = data.triggerTime;
                    lepaskanBolaKecil();
                }
            }
        });
    }
    inisialisasiRoom();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let nodesArray = [];
    let currentNodeIndex = 0;
    let kameraY = 0; 
    let targetKameraY = 0;

    const bolaKecil = {
        radius: 12,
        warna: '#ff7675',
        sudut: 0,
        kecepatanRotasi: 0.045, 
        kecepatanTerbang: 22, // Dipercepat sedikit karena gap antar bola membesar
        status: 'mengorbit', 
        x: 0, 
        y: 0,
        vx: 0, 
        vy: 0,
        history: [] 
    };

    // GENERASI LEVEL DENGAN ALGORITMA ANTI-TUMPUK (SPATIAL CHECKING)
    function susunLevel() {
        nodesArray = [];
        let tengahX = window.innerWidth / 2;
        let lebarLayar = window.innerWidth;
        
        // 1. Bola Start (Awal) dijamin aman di tengah bawah
        nodesArray.push({ x: tengahX, y: 0, radius: 60, warna: '#0984e3' });
        
        const warnaWarni = ['#a01a58', '#6c5ce7', '#00b894', '#e17055', '#fdcb6e', '#00cec9', '#e84393', '#6f11d1', '#26de81'];
        
        let tinggiMaksimal = 14000; // Ruang vertikal ditingkatkan drastis agar muat bola besar
        let targetJumlahBola = 160; 
        let batasPercobaan = 3000; // Mencegah freeze jika layar penuh
        let bolaBerhasilDibuat = 0;

        // 2. Membentuk Bola Secara Acak & Mengecek Tabrakan
        for (let i = 0; i < batasPercobaan; i++) {
            if (bolaBerhasilDibuat >= targetJumlahBola) break;

            let radiusAcak = 40 + Math.random() * 45; // Ukuran diperbesar (40px s/d 85px)
            
            // Jangan terlalu ke pinggir layar
            let acakX = radiusAcak + 30 + Math.random() * (lebarLayar - (radiusAcak * 2) - 60); 
            let acakY = -(Math.random() * tinggiMaksimal) - 200; 

            // Cek Spasial: Apakah posisi ini menabrak bola lain yang sudah ada?
            let posisiAman = true;
            for (let j = 0; j < nodesArray.length; j++) {
                let bolaLain = nodesArray[j];
                let dx = acakX - bolaLain.x;
                let dy = acakY - bolaLain.y;
                let jarakAntarPusat = Math.sqrt(dx*dx + dy*dy);
                
                // Jarak batas aman = radius bola A + radius bola B + jarak kosong ekstra
                let jarakKosongEkstra = 60 + Math.random() * 40; // Ada ruang 60-100px antar bola
                let batasAman = radiusAcak + bolaLain.radius + jarakKosongEkstra;

                if (jarakAntarPusat < batasAman) {
                    posisiAman = false; // Terlalu dekat, batalkan letak bola ini
                    break;
                }
            }

            // Jika aman, masukkan ke dalam arena permainan
            if (posisiAman) {
                let warnaAcak = warnaWarni[Math.floor(Math.random() * warnaWarni.length)];
                nodesArray.push({ x: acakX, y: acakY, radius: radiusAcak, warna: warnaAcak });
                bolaBerhasilDibuat++;
            }
        }

        // Cari tahu bola mana yang posisinya paling atas/tinggi untuk meletakkan Finish
        let yTertinggi = 0;
        for (let j = 0; j < nodesArray.length; j++) {
            if (nodesArray[j].y < yTertinggi) {
                yTertinggi = nodesArray[j].y;
            }
        }

        // 3. Letakkan Bola Emas di atas bola tertinggi
        nodesArray.push({
            x: tengahX,
            y: yTertinggi - 350,
            radius: 85,
            warna: '#ffd700', // Cahaya Emas
            finish: true
        });

        // Reset Data Pemain
        currentNodeIndex = 0;
        bolaKecil.status = 'mengorbit';
        bolaKecil.sudut = -Math.PI / 2; 
        bolaKecil.history = []; 
        if(nodesArray.length > 0) kameraY = nodesArray[0].y;
    }

    document.getElementById('btn-reset').addEventListener('click', () => {
        susunLevel();
    });

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        susunLevel();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function jalankanGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (nodesArray.length === 0) {
            requestAnimationFrame(jalankanGame);
            return;
        }

        targetKameraY = nodesArray[currentNodeIndex].y;
        kameraY += (targetKameraY - kameraY) * 0.08; 

        // 1. MENGGAMBAR BOLA BESAR
        for(let i = 0; i < nodesArray.length; i++) {
            let node = nodesArray[i];
            let drawY = node.y - kameraY + canvas.height / 2;

            if (drawY > -200 && drawY < canvas.height + 200) {
                ctx.beginPath();
                ctx.arc(node.x, drawY, node.radius, 0, Math.PI * 2);
                ctx.fillStyle = node.warna;
                
                if (node.finish) {
                    ctx.shadowBlur = 40;
                    ctx.shadowColor = '#ffd700'; 
                } else if(i === currentNodeIndex) {
                    ctx.shadowBlur = 25; 
                    ctx.shadowColor = node.warna;
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;
            }
        }

        let nodeAktif = nodesArray[currentNodeIndex];
        let jarakOrbitIdeal = nodeAktif.radius + 30; // Radius melingkar menyesuaikan besarnya bola

        // 2. LOGIKA BOLA KECIL
        if (bolaKecil.status === 'mengorbit') {
            bolaKecil.sudut += bolaKecil.kecepatanRotasi;
            bolaKecil.x = nodeAktif.x + jarakOrbitIdeal * Math.cos(bolaKecil.sudut);
            bolaKecil.y = nodeAktif.y + jarakOrbitIdeal * Math.sin(bolaKecil.sudut);

        } else if (bolaKecil.status === 'lepas') {
            bolaKecil.x += bolaKecil.vx;
            bolaKecil.y += bolaKecil.vy;

            for (let i = 0; i < nodesArray.length; i++) {
                if (i === currentNodeIndex) continue;

                let targetNode = nodesArray[i];
                let jarakTargetOrbit = targetNode.radius + 30;
                
                let dx = bolaKecil.x - targetNode.x;
                let dy = bolaKecil.y - targetNode.y;
                let distance = Math.sqrt(dx*dx + dy*dy);

                // Toleransi pendaratan disesuaikan agar tidak mudah gagal tapi tidak terlalu mudah
                if (distance <= jarakTargetOrbit + 20) { 
                    currentNodeIndex = i; 
                    bolaKecil.status = 'mengorbit';
                    bolaKecil.sudut = Math.atan2(dy, dx); 
                    
                    if (targetNode.finish) {
                        bolaKecil.kecepatanRotasi = 0.08; 
                    }
                    break;
                }
            }

            let batasBawahKamera = kameraY + (canvas.height / 2); 
            if (bolaKecil.y > batasBawahKamera + 300 || bolaKecil.x < -300 || bolaKecil.x > canvas.width + 300) {
                susunLevel(); 
            }
        }

        // 3. EFEK EKOR BOLA KECIL
        bolaKecil.history.push({ x: bolaKecil.x, y: bolaKecil.y });
        if (bolaKecil.history.length > 20) {
            bolaKecil.history.shift(); 
        }

        for (let i = 0; i < bolaKecil.history.length; i++) {
            let posisiLama = bolaKecil.history[i];
            let drawEkorY = posisiLama.y - kameraY + canvas.height / 2;
            let rasioEkor = i / bolaKecil.history.length; 
            let transparansi = rasioEkor * 0.45; 
            let radiusEkor = bolaKecil.radius * (0.3 + rasioEkor * 0.7); 

            ctx.beginPath();
            ctx.arc(posisiLama.x, drawEkorY, radiusEkor, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 118, 117, ${transparansi})`; 
            ctx.fill();
            ctx.closePath();
        }

        // 4. GAMBAR BOLA KECIL INTI
        let drawBolaKecilY = bolaKecil.y - kameraY + canvas.height / 2;
        ctx.beginPath();
        ctx.arc(bolaKecil.x, drawBolaKecilY, bolaKecil.radius, 0, Math.PI * 2);
        ctx.fillStyle = bolaKecil.warna;
        ctx.shadowBlur = 15;
        ctx.shadowColor = bolaKecil.warna;
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;

        requestAnimationFrame(jalankanGame);
    }

    function lepaskanBolaKecil() {
        if (bolaKecil.status === 'mengorbit' && !nodesArray[currentNodeIndex].finish) {
            bolaKecil.status = 'lepas';
            bolaKecil.vx = bolaKecil.kecepatanTerbang * Math.cos(bolaKecil.sudut + Math.PI / 2);
            bolaKecil.vy = bolaKecil.kecepatanTerbang * Math.sin(bolaKecil.sudut + Math.PI / 2);
        }
    }

    jalankanGame();

</script>
</body>
</html>
