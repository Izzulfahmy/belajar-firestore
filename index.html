<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Jump - Neon Space Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; text-align: center; background-color: #060913; color: white; margin: 0; padding: 0; overflow: hidden; }
        
        /* LOBBY AREA: Modern Cyberpunk Card */
        #lobby-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(13, 18, 30, 0.85); padding: 45px; border-radius: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 50px rgba(56, 189, 248, 0.15); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(16px); z-index: 10; max-width: 380px; width: 90%; }
        #lobby-area h1 { margin-top: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; color: #f8fafc; }
        #qrcode { margin: 25px auto; background: white; padding: 18px; border-radius: 16px; display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        #status-teks { font-size: 1.05rem; color: #fbbf24; font-weight: 600; letter-spacing: 0.5px; }
        
        #game-area { display: none; width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; width: 100%; height: 100%; background: radial-gradient(circle at center, #0f172a 0%, #070a13 100%); }
        
        /* TOMBOL RESET: Futuristic Neon Glassmorphism */
        #btn-reset { position: absolute; top: 25px; right: 25px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; padding: 10px 26px; border-radius: 30px; cursor: pointer; font-size: 0.9rem; font-weight: 700; backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 20; text-transform: uppercase; letter-spacing: 1px; }
        #btn-reset:hover { background: #38bdf8; color: #070a13; box-shadow: 0 0 25px rgba(56, 189, 248, 0.6); border-color: #38bdf8; transform: translateY(-1px); }
        #btn-reset:active { transform: translateY(1px); }
    </style>
</head>
<body>

    <div id="lobby-area">
        <h1>Galaxy Orbit</h1>
        <div id="qrcode"></div>
        <p id="status-teks">Menunggu Controller...</p>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 0; margin-top: 15px;">ROOM CODE: <span id="room-id-display" style="color: #38bdf8; font-weight: 700;"></span></p>
    </div>

    <div id="game-area">
        <button id="btn-reset">Acak Level</button>
        <canvas id="gameCanvas"></canvas>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB00E-07MNJoN0IfNOsCm9KcH-y7TTwvYQ",
        authDomain: "belajar-github-firestore.firebaseapp.com",
        projectId: "belajar-github-firestore",
        storageBucket: "belajar-github-firestore.firebasestorage.app",
        messagingSenderId: "246762592469",
        appId: "1:246762592469:web:595d8f2a8a78909771aa5c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const roomId = "Room-" + Math.random().toString(36).substring(2, 6).toUpperCase();
    document.getElementById("room-id-display").innerText = roomId;

    const currentUrl = window.location.href.split('/').slice(0, -1).join('/'); 
    const controllerUrl = `${currentUrl}/controller.html?room=${roomId}`;

    new QRCode(document.getElementById("qrcode"), { text: controllerUrl, width: 180, height: 180 });

    let triggerTerakhir = 0; 

    async function inisialisasiRoom() {
        const docRef = doc(db, "sesi_game", roomId);
        await setDoc(docRef, { status: "menunggu", triggerTime: 0 });

        onSnapshot(docRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();

                if (data.status === "terhubung" && document.getElementById("lobby-area").style.display !== "none") {
                    document.getElementById("lobby-area").style.display = "none";
                    document.getElementById("game-area").style.display = "block";
                    resizeCanvas(); 
                }

                if (data.triggerTime > 0 && data.triggerTime !== triggerTerakhir) {
                    triggerTerakhir = data.triggerTime;
                    lepaskanBolaKecil();
                }
            }
        });
    }
    inisialisasiRoom();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let nodesArray = [];
    let bintangArray = []; // Array penampung partikel bintang parallax
    let currentNodeIndex = 0;
    let kameraY = 0; 
    let targetKameraY = 0;

    const bolaKecil = {
        radius: 10,
        warna: '#ff7675',
        sudut: 0,
        kecepatanRotasi: 0.045, 
        arahRotasi: 1, 
        kecepatanTerbang: 22, 
        status: 'mengorbit', 
        x: 0, 
        y: 0,
        vx: 0, 
        vy: 0,
        history: [] // Diperpanjang kapasitas penampungannya di loop utama
    };

    function susunLevel() {
        nodesArray = [];
        let tengahX = window.innerWidth / 2;
        let lebarLayar = window.innerWidth;
        
        nodesArray.push({ x: tengahX, y: 0, radius: 60, warna: '#0ea5e9' });
        
        const warnaWarni = ['#f43f5e', '#6366f1', '#10b981', '#f97316', '#eab308', '#06b6d4', '#d946ef', '#8b5cf6'];
        
        let tinggiMaksimal = 14000; 
        let targetJumlahBola = 160; 
        let batasPercobaan = 3000; 
        let bolaBerhasilDibuat = 0;

        for (let i = 0; i < batasPercobaan; i++) {
            if (bolaBerhasilDibuat >= targetJumlahBola) break;

            let radiusAcak = 40 + Math.random() * 45; 
            let acakX = radiusAcak + 40 + Math.random() * (lebarLayar - (radiusAcak * 2) - 80); 
            let acakY = -(Math.random() * tinggiMaksimal) - 200; 

            let posisiAman = true;
            for (let j = 0; j < nodesArray.length; j++) {
                let bolaLain = nodesArray[j];
                let dx = acakX - bolaLain.x;
                let dy = acakY - bolaLain.y;
                let jarakAntarPusat = Math.sqrt(dx*dx + dy*dy);
                
                let jarakKosongEkstra = 65 + Math.random() * 45; 
                let batasAman = radiusAcak + bolaLain.radius + jarakKosongEkstra;

                if (jarakAntarPusat < batasAman) {
                    posisiAman = false; 
                    break;
                }
            }

            if (posisiAman) {
                let warnaAcak = warnaWarni[Math.floor(Math.random() * warnaWarni.length)];
                nodesArray.push({ x: acakX, y: acakY, radius: radiusAcak, warna: warnaAcak });
                bolaBerhasilDibuat++;
            }
        }

        let yTertinggi = 0;
        for (let j = 0; j < nodesArray.length; j++) {
            if (nodesArray[j].y < yTertinggi) {
                yTertinggi = nodesArray[j].y;
            }
        }

        nodesArray.push({
            x: tengahX,
            y: yTertinggi - 380,
            radius: 85,
            warna: '#ffd700',
            finish: true
        });

        // GENERASI BINTANG LATAR BELAKANG (PARALLAX)
        bintangArray = [];
        for (let s = 0; s < 120; s++) {
            bintangArray.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: 0.5 + Math.random() * 1.8,
                alpha: 0.2 + Math.random() * 0.6
            });
        }

        currentNodeIndex = 0;
        bolaKecil.status = 'mengorbit';
        bolaKecil.sudut = -Math.PI / 2; 
        bolaKecil.arahRotasi = 1; 
        bolaKecil.history = []; 
        if(nodesArray.length > 0) kameraY = nodesArray[0].y;
    }

    document.getElementById('btn-reset').addEventListener('click', () => {
        susunLevel();
    });

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        susunLevel();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function jalankanGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (nodesArray.length === 0) {
            requestAnimationFrame(jalankanGame);
            return;
        }

        // Kamera Smooth Interpolation (Lerp)
        targetKameraY = nodesArray[currentNodeIndex].y;
        let deltaKamera = (targetKameraY - kameraY);
        kameraY += deltaKamera * 0.08; 

        // 1. DRAW PARALLAX STARS BACKGROUND
        ctx.save();
        for (let i = 0; i < bintangArray.length; i++) {
            let bintang = bintangArray[i];
            
            // Gerakan bintang berlawanan arah kamera dengan faktor kelambatan 0.25 (Efek Parallax Jauh)
            let drawBintangY = (bintang.y - kameraY * 0.25) % canvas.height;
            if (drawBintangY < 0) drawBintangY += canvas.height;

            ctx.beginPath();
            ctx.arc(bintang.x, drawBintangY, bintang.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${bintang.alpha})`;
            ctx.fill();
            ctx.closePath();
        }
        ctx.restore();

        // 2. MENGGAMBAR SEMUA BOLA BESAR (PLANET)
        for(let i = 0; i < nodesArray.length; i++) {
            let node = nodesArray[i];
            let drawY = node.y - kameraY + canvas.height / 2;

            if (drawY > -200 && drawY < canvas.height + 200) {
                ctx.beginPath();
                ctx.arc(node.x, drawY, node.radius, 0, Math.PI * 2);
                ctx.fillStyle = node.warna;
                
                if (node.finish) {
                    ctx.shadowBlur = 45;
                    ctx.shadowColor = '#ffd700'; 
                } else if(i === currentNodeIndex) {
                    ctx.shadowBlur = 25; 
                    ctx.shadowColor = node.warna;
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;
            }
        }

        let nodeAktif = nodesArray[currentNodeIndex];
        let jarakOrbitIdeal = nodeAktif.radius + 28; 

        // 3. LOGIKA POSISI BOLA KECIL
        if (bolaKecil.status === 'mengorbit') {
            bolaKecil.sudut += (bolaKecil.kecepatanRotasi * bolaKecil.arahRotasi);
            bolaKecil.x = nodeAktif.x + jarakOrbitIdeal * Math.cos(bolaKecil.sudut);
            bolaKecil.y = nodeAktif.y + jarakOrbitIdeal * Math.sin(bolaKecil.sudut);

        } else if (bolaKecil.status === 'lepas') {
            bolaKecil.x += bolaKecil.vx;
            bolaKecil.y += bolaKecil.vy;

            for (let i = 0; i < nodesArray.length; i++) {
                if (i === currentNodeIndex) continue;

                let targetNode = nodesArray[i];
                let jarakTargetOrbit = targetNode.radius + 28;
                
                let dx = bolaKecil.x - targetNode.x;
                let dy = bolaKecil.y - targetNode.y;
                let distance = Math.sqrt(dx*dx + dy*dy);

                // Deteksi pendaratan yang sangat mulus & presisi
                if (distance <= jarakTargetOrbit + 18) { 
                    let crossProduct = (bolaKecil.vx * dy) - (bolaKecil.vy * dx);
                    bolaKecil.arahRotasi = (crossProduct > 0) ? -1 : 1;
                    
                    currentNodeIndex = i; 
                    bolaKecil.status = 'mengorbit';
                    bolaKecil.sudut = Math.atan2(dy, dx); 
                    
                    if (targetNode.finish) {
                        bolaKecil.kecepatanRotasi = 0.08; 
                    }
                    break;
                }
            }

            let batasBawahKamera = kameraY + (canvas.height / 2); 
            if (bolaKecil.y > batasBawahKamera + 300 || bolaKecil.x < -300 || bolaKecil.x > canvas.width + 300) {
                susunLevel(); 
            }
        }

        // 4. DRAW EFEK EKOR LASER SUPER PANJANG & GLOWING (GLOW TRAIL)
        // Masukkan posisi koordinat absolut bola kecil saat ini ke histori jejak
        bolaKecil.history.push({ x: bolaKecil.x, y: bolaKecil.y });
        
        // Batasan ekor diperpanjang menjadi 45 agar terlihat mengalir sangat panjang
        if (bolaKecil.history.length > 45) {
            bolaKecil.history.shift(); 
        }

        ctx.save();
        // Menggunakan blending mode 'lighter' agar tumpukan partikel ekor memancarkan efek cahaya neon cerah
        ctx.globalCompositeOperation = 'lighter'; 

        for (let i = 0; i < bolaKecil.history.length; i++) {
            let posisiLama = bolaKecil.history[i];
            let drawEkorY = posisiLama.y - kameraY + canvas.height / 2;
            let rasioEkor = i / bolaKecil.history.length; 
            
            // Mengatur opacity (transparansi) linier memudar di ujung
            let transparansi = rasioEkor * 0.55; 
            // Ukuran ekor meruncing mengecil secara dinamis
            let radiusEkor = bolaKecil.radius * (0.15 + rasioEkor * 0.85); 

            ctx.beginPath();
            ctx.arc(posisiLama.x, drawEkorY, radiusEkor, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 118, 117, ${transparansi})`; 
            ctx.fill();
            ctx.closePath();
        }
        ctx.restore(); // Kembalikan mode blending normal untuk elemen berikutnya

        // 5. GAMBAR BOLA KECIL INTI (PEMAIN)
        let drawBolaKecilY = bolaKecil.y - kameraY + canvas.height / 2;
        ctx.beginPath();
        ctx.arc(bolaKecil.x, drawBolaKecilY, bolaKecil.radius, 0, Math.PI * 2);
        ctx.fillStyle = bolaKecil.warna;
        ctx.shadowBlur = 18;
        ctx.shadowColor = bolaKecil.warna;
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;

        requestAnimationFrame(jalankanGame);
    }

    function lepaskanBolaKecil() {
        if (bolaKecil.status === 'mengorbit' && !nodesArray[currentNodeIndex].finish) {
            bolaKecil.status = 'lepas';
            let sudutTerbang = bolaKecil.sudut + (Math.PI / 2 * bolaKecil.arahRotasi);
            bolaKecil.vx = bolaKecil.kecepatanTerbang * Math.cos(sudutTerbang);
            bolaKecil.vy = bolaKecil.kecepatanTerbang * Math.sin(sudutTerbang);
        }
    }

    jalankanGame();

</script>
</body>
</html>
