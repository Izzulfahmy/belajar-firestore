<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layar Utama - Orbit Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #2c3e50; color: white; padding-top: 50px; }
        .container { background: #34495e; padding: 40px; border-radius: 12px; display: inline-block; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        #qrcode { margin: 20px auto; background: white; padding: 15px; border-radius: 8px; display: inline-block; }
        h1 { margin-bottom: 10px; color: #ecf0f1; }
        #status-teks { font-size: 1.2rem; color: #f1c40f; font-weight: bold; }
        
        /* Area simulasi game ketika terhubung */
        #game-area { display: none; margin-top: 30px; }
        .bola-trigger { display: inline-block; width: 100px; height: 100px; background-color: #e74c3c; border-radius: 50%; transition: transform 0.1s; }
    </style>
</head>
<body>

    <div class="container" id="lobby-area">
        <h1>Scan untuk Bermain!</h1>
        <p>Arahkan kamera HP Anda ke QR Code di bawah ini</p>
        
        <div id="qrcode"></div>
        
        <p id="status-teks">Menunggu pemain terhubung...</p>
        <p style="font-size: 0.9rem; color: #bdc3c7;">Room ID: <span id="room-id-display"></span></p>
    </div>

    <div class="container" id="game-area">
        <h1 style="color: #2ecc71;">Pemain Terhubung!</h1>
        <p>Silakan tekan tombol pemicu di HP Anda.</p>
        <div class="bola-trigger" id="bola-visual"></div>
        <h2 id="log-trigger">Menunggu tembakan...</h2>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB00E-07MNJoN0IfNOsCm9KcH-y7TTwvYQ",
        authDomain: "belajar-github-firestore.firebaseapp.com",
        projectId: "belajar-github-firestore",
        storageBucket: "belajar-github-firestore.firebasestorage.app",
        messagingSenderId: "246762592469",
        appId: "1:246762592469:web:595d8f2a8a78909771aa5c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Generate ID Ruangan Acak (Contoh: Room-8A2B)
    const roomId = "Room-" + Math.random().toString(36).substring(2, 6).toUpperCase();
    document.getElementById("room-id-display").innerText = roomId;

    // 2. Tentukan URL untuk HP (Otomatis mendeteksi domain tempat HTML ini di-host)
    // Ingat: file controller.html harus berada di folder yang sama dengan game.html
    const currentUrl = window.location.href.replace("game.html", ""); 
    const controllerUrl = `${currentUrl}controller.html?room=${roomId}`;

    // 3. Buat QR Code
    new QRCode(document.getElementById("qrcode"), {
        text: controllerUrl,
        width: 200,
        height: 200,
    });

    // 4. Siapkan Dokumen di Firestore & Mulai Mendengarkan (Listen)
    const docRef = doc(db, "sesi_game", roomId);

    async function inisialisasiRoom() {
        // Buat dokumen dengan status awal
        await setDoc(docRef, { status: "menunggu", triggerTime: 0 });

        // Mulai dengarkan perubahan secara real-time
        onSnapshot(docRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();

                // Cek apakah HP sudah scan dan mengubah status
                if (data.status === "terhubung") {
                    document.getElementById("lobby-area").style.display = "none";
                    document.getElementById("game-area").style.display = "block";
                }

                // Cek apakah tombol di HP ditekan (berdasarkan perubahan timestamp)
                if (data.triggerTime > 0) {
                    const logEl = document.getElementById("log-trigger");
                    const bolaEl = document.getElementById("bola-visual");
                    
                    logEl.innerText = "🔥 Tembakan Diterima! (" + data.triggerTime + ")";
                    
                    // Efek visual sederhana membesar lalu mengecil saat tombol HP ditekan
                    bolaEl.style.transform = "scale(1.5)";
                    setTimeout(() => {
                        bolaEl.style.transform = "scale(1)";
                    }, 150);
                }
            }
        });
    }

    inisialisasiRoom();
</script>
</body>
</html>
