<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#060913">
    <title>Controller - Galaxy Orbit</title>
    <style>
        /* Desain Modern Cyberpunk / Neon Space */
        body, html { 
            height: 100%; margin: 0; display: flex; align-items: center; justify-content: center; 
            background: radial-gradient(circle at center, #0f172a 0%, #060913 100%); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            overflow: hidden; color: white;
        }
        
        #status-info { 
            text-align: center; color: #38bdf8; font-size: 1.1rem; position: absolute; top: 40px; 
            width: 100%; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            z-index: 20;
        }
        
        /* Container untuk membungkus tombol dan efek radar */
        #trigger-wrapper {
            position: relative;
            display: none; /* Disembunyikan sebelum koneksi berhasil */
            align-items: center;
            justify-content: center;
        }

        /* Animasi Efek Radar / Pulse memancar di belakang tombol */
        #trigger-wrapper::before, #trigger-wrapper::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0.6);
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: 1;
            pointer-events: none;
        }
        #trigger-wrapper::after {
            animation-delay: 1s; /* Gelombang kedua */
        }

        @keyframes pulse-ring {
            0% { width: 80vw; height: 80vw; max-width: 300px; max-height: 300px; opacity: 1; }
            100% { width: 140vw; height: 140vw; max-width: 550px; max-height: 550px; opacity: 0; }
        }

        /* Tombol Utama (Glassmorphism & Neon Glow) */
        #btn-trigger {
            position: relative;
            width: 80vw; height: 80vw; max-width: 300px; max-height: 300px;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(14, 165, 233, 0.15), rgba(2, 132, 199, 0.4));
            color: #f8fafc;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.3), inset 0 0 25px rgba(56, 189, 248, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* Menghilangkan kedip biru bawaan browser HP */
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            z-index: 10;
        }
        
        /* Efek Meledak Terang Saat Ditekan */
        #btn-trigger:active { 
            transform: scale(0.88); 
            box-shadow: 0 0 80px rgba(56, 189, 248, 0.9), inset 0 0 50px rgba(56, 189, 248, 0.7); 
            background: linear-gradient(145deg, rgba(14, 165, 233, 0.5), rgba(2, 132, 199, 0.8));
            border-color: #bae6fd;
            color: #ffffff;
            text-shadow: 0 0 25px #ffffff;
        }
    </style>
</head>
<body>

    <div id="status-info">Menyiapkan Ruang...</div>
    
    <div id="trigger-wrapper">
        <button id="btn-trigger">JUMP</button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB00E-07MNJoN0IfNOsCm9KcH-y7TTwvYQ",
        authDomain: "belajar-github-firestore.firebaseapp.com",
        projectId: "belajar-github-firestore",
        storageBucket: "belajar-github-firestore.firebasestorage.app",
        messagingSenderId: "246762592469",
        appId: "1:246762592469:web:595d8f2a8a78909771aa5c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');

    const statusInfo = document.getElementById("status-info");
    const triggerWrapper = document.getElementById("trigger-wrapper");
    const btnTrigger = document.getElementById("btn-trigger");

    if (roomId) {
        statusInfo.innerText = "Menghubungkan...";
        const docRef = doc(db, "sesi_game", roomId);

        async function hubungkanKeLaptop() {
            try {
                await updateDoc(docRef, {
                    status: "terhubung"
                });
                
                // Ubah teks dan tampilkan tombol beserta efek radarnya
                statusInfo.innerText = "Sistem Online";
                triggerWrapper.style.display = "flex";
            } catch (error) {
                statusInfo.innerText = "Error: Ruang Hampa.";
                console.error(error);
            }
        }
        
        hubungkanKeLaptop();

        btnTrigger.addEventListener("pointerdown", async (e) => {
            e.preventDefault(); 
            
            try {
                await updateDoc(docRef, {
                    triggerTime: Date.now() 
                });
                
                if (navigator.vibrate) navigator.vibrate(40); // Getaran singkat khas sci-fi
            } catch (error) {
                console.error("Gagal menembak", error);
            }
        });

    } else {
        statusInfo.innerText = "Gagal: URL Tidak Valid. Scan QR Code!";
        statusInfo.style.color = "#ef4444";
        statusInfo.style.textShadow = "0 0 15px rgba(239, 68, 68, 0.5)";
    }
</script>
</body>
</html>
