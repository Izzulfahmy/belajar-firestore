<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Controller - Galaxy Orbit</title>
    <style>
        /* Desain UI Minimalis & Clean */
        body, html { 
            height: 100%; margin: 0; 
            display: flex; align-items: center; justify-content: center; 
            background-color: #0f172a; /* Warna gelap solid, elegan */
            font-family: 'Segoe UI', system-ui, sans-serif; 
            overflow: hidden; 
        }
        
        #status-info { 
            text-align: center; 
            color: #94a3b8; 
            font-size: 1.1rem; 
            position: absolute; 
            top: 50px; 
            width: 100%; 
            font-weight: 500;
        }
        
        /* Tombol Fisik Bergaya Arcade (Tactile Button) */
        #btn-trigger {
            display: none; /* Sembunyikan sebelum koneksi berhasil */
            width: 75vw; 
            height: 75vw; 
            max-width: 280px; 
            max-height: 280px;
            border-radius: 50%;
            background-color: #38bdf8;
            color: #0f172a;
            font-size: 2.5rem;
            font-weight: 800;
            border: none;
            /* Membuat efek 3D tombol timbul */
            box-shadow: 0 12px 0 #0284c7, 0 20px 25px rgba(0,0,0,0.5);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.1s;
            letter-spacing: 2px;
        }
        
        /* Efek saat tombol ditekan (Amblas ke bawah) */
        #btn-trigger:active { 
            transform: translateY(12px); /* Turun sejauh ketebalan shadow */
            box-shadow: 0 0 0 #0284c7, 0 5px 10px rgba(0,0,0,0.5); 
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <div id="status-info">Menyiapkan Ruang...</div>
    
    <button id="btn-trigger">JUMP</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi Firebase Anda
    const firebaseConfig = {
        apiKey: "AIzaSyB00E-07MNJoN0IfNOsCm9KcH-y7TTwvYQ",
        authDomain: "belajar-github-firestore.firebaseapp.com",
        projectId: "belajar-github-firestore",
        storageBucket: "belajar-github-firestore.firebasestorage.app",
        messagingSenderId: "246762592469",
        appId: "1:246762592469:web:595d8f2a8a78909771aa5c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');

    const statusInfo = document.getElementById("status-info");
    const btnTrigger = document.getElementById("btn-trigger");

    if (roomId) {
        statusInfo.innerText = "Menghubungkan...";
        const docRef = doc(db, "sesi_game", roomId);

        async function hubungkanKeLaptop() {
            try {
                await updateDoc(docRef, {
                    status: "terhubung"
                });
                
                // Teks kembali normal dan tidak aneh
                statusInfo.innerText = "Terhubung! (ID: " + roomId + ")";
                btnTrigger.style.display = "block";
            } catch (error) {
                statusInfo.innerText = "Error: Ruang tidak ditemukan.";
                console.error(error);
            }
        }
        
        hubungkanKeLaptop();

        btnTrigger.addEventListener("pointerdown", async (e) => {
            e.preventDefault(); 
            
            try {
                await updateDoc(docRef, {
                    triggerTime: Date.now() 
                });
                
                if (navigator.vibrate) navigator.vibrate(40); 
            } catch (error) {
                console.error("Gagal mengirim trigger", error);
            }
        });

    } else {
        statusInfo.innerText = "Gagal: URL Tidak Valid. Harap scan QR Code!";
        statusInfo.style.color = "#ef4444";
    }
</script>
</body>
</html>
